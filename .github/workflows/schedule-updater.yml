name: update-companies-data
on:
  schedule:
    # NEPSE trades 11:00-15:00 Nepal time (UTC+5:45), Sun-Thu. First run is
    # right after the close (09:30 UTC = 15:15 NPT); the later runs are retries
    # and also refresh today's row if the site corrected anything:
    # 15:15, 16:15, 17:15, 19:15 and 22:15 NPT.
    - cron: "30 9,10,11,13,16 * * 0,1,2,3,4,5"
  workflow_dispatch:
defaults:
  run:
    working-directory: ./src
jobs:
  update-daily-data:
    name: update-daily-data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2
        with:
          python-version: "3.8" # Version range or exact version of a Python version to use, using SemVer's version range syntax
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Run updater
        run: python dailyDataScrapper.py
      - name: Setup Git
        run: git config --local user.email "aabishkar2@gmail.com" && git config --local user.name "Aabishkar Wagle Bot"
      - name: Commit Files
        id: commit
        run: |
          git stage ../data
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update data"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Push changes
        if: steps.commit.outputs.changed == 'true'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
