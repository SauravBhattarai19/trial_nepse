name: update-companies-data
on:
  schedule:
    # NEPSE trades 11:00-15:00 Nepal time (UTC+5:45), Sun-Thu. First run is
    # right after the close (09:30 UTC = 15:15 NPT); the later runs are retries
    # and also refresh today's row if the site corrected anything:
    # 15:15, 16:15, 17:15, 19:15 and 22:15 NPT.
    - cron: "30 9,10,11,13,16 * * 0,1,2,3,4,5"
  workflow_dispatch:

# Repos created since 2023 give workflows a read-only token by default; the
# job pushes the new rows back to main, so it needs write access.
permissions:
  contents: write

# Don't let a slow run and the next retry push at the same time.
concurrency:
  group: update-companies-data
  cancel-in-progress: false

defaults:
  run:
    working-directory: ./src
jobs:
  update-daily-data:
    name: update-daily-data
    # Pinned rather than ubuntu-latest, which is moving to Ubuntu 26.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # Python 3.8 is end-of-life and no longer offered on GitHub's runners.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/requirements.txt
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Run updater
        run: python dailyDataScrapper.py
      - name: Setup Git
        run: git config --local user.email "41898283+github-actions[bot]@users.noreply.github.com" && git config --local user.name "github-actions[bot]"
      - name: Commit Files
        id: commit
        run: |
          git stage ../data
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update data"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Push changes
        if: steps.commit.outputs.changed == 'true'
        run: |
          # main may have moved since checkout (e.g. the breadth workflow pushed)
          git pull --rebase origin main
          git push origin HEAD:main
