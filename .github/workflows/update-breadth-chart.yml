name: update-breadth-chart-and-site
on:
  # Runs every time the daily price scraper finishes, so the site refreshes
  # right after the market close (the scraper's first run is 15:15 NPT).
  workflow_run:
    workflows: ["update-companies-data"]
    types: [completed]
    branches: [main]
  # Redeploy when the site or the scripts behind it change.
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/**"
      - ".github/workflows/update-breadth-chart.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# One run at a time; a queued run still goes ahead so the newest data ships.
concurrency:
  group: breadth-and-site
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install packages
        run: pip install -r scripts/requirements.txt

      - name: Fetch NEPSE index history
        # If ShareSansar is unreachable, carry on with the index already on file.
        continue-on-error: true
        run: python scripts/fetch_nepse_index.py

      - name: Build advancers/decliners breadth
        run: python scripts/build_breadth.py

      - name: Build combined dataset (AD line + moving averages)
        run: python scripts/build_combined.py

      - name: Classify securities (stock / mutual fund / debenture)
        run: python scripts/securities.py

      - name: Fill in / verify stock sectors from ShareSansar
        # Only looks up rows not yet verified (first run: all; then new listings).
        continue-on-error: true
        run: python scripts/sectors.py

      - name: Render charts
        run: python scripts/plot_chart.py

      - name: Log today's breadth signals (forward-test record)
        run: python scripts/log_signals.py

      - name: Build interactive site
        run: python scripts/build_site.py

      - name: Build stock screener + AI ranking, log today's suggestions (forward-test record)
        # If this step ever breaks, the breadth chart still ships; the page says the
        # stock analysis is unavailable.
        continue-on-error: true
        run: python scripts/build_screener.py --log

      - name: Setup Git
        run: git config --local user.email "actions@github.com" && git config --local user.name "nepse-breadth-bot"

      - name: Commit outputs
        id: commit
        run: |
          git add data/nepse-index.csv data/market-breadth.csv data/combined.csv data/security-types.csv data/sectors.csv data/signal-log.csv charts/
          if [ -f data/picks-log.csv ]; then git add data/picks-log.csv; fi
          if git diff --staged --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update market breadth data and charts"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push changes
        if: steps.commit.outputs.changed == 'true'
        run: |
          # the data scraper may have pushed since checkout
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
